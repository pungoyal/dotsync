name: docs

# Builds the documentation site (website/) on every PR, checking all internal links, and
# deploys it to GitHub Pages on pushes to main. The deployed site also serves the signed APT
# repository (/apt/) with the latest release's .deb packages; the release workflow runs this
# workflow after every release to refresh it.
on:
  push:
    branches: [main]
    paths: ["website/**", "packaging/apt/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read # verify the packages' build provenance
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "last updated" dates come from git history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26" # keep in step with mise.toml
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      # Needs secrets.APT_SIGNING_KEY (see CONTRIBUTING.md); without it the site deploys
      # without the APT repository.
      - name: Add the APT repository
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::APT_SIGNING_KEY is not set; the site is deployed without the APT repository"
            exit 0
          fi
          debs="$RUNNER_TEMP/debs"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --pattern checksums.txt --dir "$debs"
          set -- "$debs"/*.deb
          if [ ! -e "$1" ]; then
            echo "::warning::the latest release has no .deb packages; the site is deployed without the APT repository"
            exit 0
          fi
          (cd "$debs" && sha256sum --check --ignore-missing checksums.txt)
          for deb in "$@"; do gh attestation verify "$deb" --repo "$GITHUB_REPOSITORY"; done
          packaging/apt/build-repo.sh "$debs" website/dist/apt
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
