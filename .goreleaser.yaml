# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: dotsync

before:
  hooks:
    - go mod tidy
    - go mod verify
    - scripts/package-files.sh {{ .Version }} {{ .CommitTimestamp }}

builds:
  - id: dotsync
    main: ./cmd/dotsync
    binary: dotsync
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/pungoyal/dotsync/internal/dotsync.Version={{ .Version }}
      - -X github.com/pungoyal/dotsync/internal/dotsync.Commit={{ .FullCommit }}
      - -X github.com/pungoyal/dotsync/internal/dotsync.Date={{ .CommitDate }}
    # Reproducible builds: timestamps come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: build/dotsync.1.gz
        dst: manpages/dotsync.1.gz

# Debian/Ubuntu package. Checksummed, attested and published like the archives; the docs
# workflow also serves the latest one from a signed APT repository (see packaging/apt/).
nfpms:
  - id: deb
    package_name: dotsync
    formats: [deb]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: dotsync
    maintainer: Puneet Goyal <pungoyal@gmail.com>
    homepage: https://pungoyal.github.io/dotsync/
    description: |-
      Set-and-forget dotfile sync for macOS and Linux
       dotsync keeps dotfiles in sync across machines through a private git
       repository. Edit a file on any machine and a background agent propagates
       it everywhere else. Local files are backed up before they are replaced,
       and concurrent edits become conflicts instead of silent overwrites.
    license: MIT
    section: utils
    priority: optional
    bindir: /usr/bin
    # Commit time, not build time, so the package is reproducible.
    mtime: "{{ .CommitDate }}"
    dependencies:
      - git (>= 1:2.20)
    contents:
      - src: LICENSE
        dst: /usr/share/doc/dotsync/copyright
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/dotsync/README.md
        file_info:
          mode: 0644
      - src: build/dotsync.1.gz
        dst: /usr/share/man/man1/dotsync.1.gz
        file_info:
          mode: 0644
      - src: build/changelog.gz
        dst: /usr/share/doc/dotsync/changelog.gz
        file_info:
          mode: 0644
      - src: packaging/deb/lintian-overrides
        dst: /usr/share/lintian/overrides/dotsync
        file_info:
          mode: 0644
    deb:
      fields:
        Bugs: https://github.com/pungoyal/dotsync/issues

# Snapshot (CI) builds get a Debian "native" version like a release, so the .deb that CI lints
# and installs matches what a release produces. "~" also keeps it below the next release.
snapshot:
  version_template: "{{ incpatch .Version }}~snapshot.{{ .ShortCommit }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
  - id: packages
    artifacts: package
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# release-please owns the changelog and creates the GitHub release; GoReleaser only adds assets.
changelog:
  disable: true

release:
  # release-please writes the notes; GoReleaser appends the verification instructions below.
  mode: append
  footer: |

    ---

    ### Install or update

    ```sh
    brew install pungoyal/tap/dotsync                                                                 # Homebrew
    curl -fsSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPOSITORY }}/main/install.sh | sh   # install script
    ```

    Homebrew and apt installs update with `brew upgrade dotsync` and `sudo apt upgrade`; others with `dotsync update`. For the APT repository, see [installation](https://pungoyal.github.io/dotsync/start/installation/).

    ### Verify this release

    ```sh
    gh attestation verify dotsync_{{ .Version }}_<os>_<arch>.tar.gz --repo {{ .Env.GITHUB_REPOSITORY }}
    # or offline, with the attached bundle:
    gh attestation verify dotsync_{{ .Version }}_<os>_<arch>.tar.gz --bundle dotsync_{{ .Version }}.intoto.jsonl --repo {{ .Env.GITHUB_REPOSITORY }}
    ```

    See [verifying releases](https://pungoyal.github.io/dotsync/project/verifying-releases/).
