# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: dotsync

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: dotsync
    main: ./cmd/dotsync
    binary: dotsync
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/pungoyal/dotsync/internal/dotsync.Version={{ .Version }}
      - -X github.com/pungoyal/dotsync/internal/dotsync.Commit={{ .FullCommit }}
      - -X github.com/pungoyal/dotsync/internal/dotsync.Date={{ .CommitDate }}
    # Reproducible builds: timestamps come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# release-please owns the changelog and creates the GitHub release; GoReleaser only adds assets.
changelog:
  disable: true

release:
  # release-please writes the notes; GoReleaser appends the verification instructions below.
  mode: append
  footer: |

    ---

    ### Install or update

    ```sh
    curl -fsSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPOSITORY }}/main/install.sh | sh   # new install
    dotsync update                                                                                    # existing install
    ```

    ### Verify this release

    ```sh
    gh attestation verify dotsync_{{ .Version }}_<os>_<arch>.tar.gz --repo {{ .Env.GITHUB_REPOSITORY }}
    # or offline, with the attached bundle:
    gh attestation verify dotsync_{{ .Version }}_<os>_<arch>.tar.gz --bundle dotsync_{{ .Version }}.intoto.jsonl --repo {{ .Env.GITHUB_REPOSITORY }}
    ```

    See [verifying releases](https://pungoyal.github.io/dotsync/project/verifying-releases/).
